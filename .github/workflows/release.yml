name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with:
#   jekyll-shim, jekyll-shim.cmd   self-contained wrappers (Unix, Windows) pinned to this release's
#                                  version and shim.jar SHA-256: on first use they download that jar
#                                  into ~/.fhir-ig-jekyll/<version>/, verify it, and run it (like gradlew)
#   shim.jar                       the shim itself (java -jar shim.jar build --destination <dir>)
#   fhir-ig-jekyll.zip             offline bundle: shim.jar + both wrappers + docs and licenses
# Asset names don't carry the version, so .../releases/latest/download/<asset> always works.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'   # class files target Java 17; runs on 17+
          cache: maven
      - name: Build (Maven; jekyll/target/shim.jar is the self-contained release jar, common shaded in)
        run: ./build.sh -B -ntp package
      - name: Test
        run: |
          git submodule update --init --depth 1 third_party/yaml-test-suite   # YAML suite case data
          sudo ln -s "$GITHUB_WORKSPACE" /w
          SHIM_NO_BUILD=1 SHIM_W_SUITES=1 scripts/test-suites.sh
      - name: Package
        run: |
          D=dist/fhir-ig-jekyll
          mkdir -p "$D"
          scripts/stamp-wrappers.sh "${TAG#v}" jekyll/target/shim.jar "$D"
          cp jekyll/target/shim.jar "$D/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md jekyll/INTEGRATION.md "$D/"
          scripts/e2e.sh "$D"
          (cd dist && zip -qr fhir-ig-jekyll.zip fhir-ig-jekyll)
          cp jekyll/target/shim.jar "$D/jekyll-shim" "$D/jekyll-shim.cmd" dist/
          (cd dist && sha256sum shim.jar jekyll-shim jekyll-shim.cmd fhir-ig-jekyll.zip > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Drop-in for the IG Publisher's Jekyll stage. Requires Java 17+.

          Quick start (Linux/macOS): download the one-file wrapper; it fetches and verifies shim.jar on first use.
              curl -fLO https://github.com/jmandel/fhir-ig-jekyll/releases/download/$TAG/jekyll-shim && chmod +x jekyll-shim
              java -jar publisher.jar -ig . -jekyll \$PWD/jekyll-shim
          Windows: download jekyll-shim.cmd and pass its full path as -jekyll.
          Offline: fhir-ig-jekyll.zip bundles shim.jar with both wrappers.
          Or run it directly in a Jekyll source folder: java -jar shim.jar build --destination <dir>"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/jekyll-shim dist/jekyll-shim.cmd dist/shim.jar dist/fhir-ig-jekyll.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/jekyll-shim dist/jekyll-shim.cmd dist/shim.jar dist/fhir-ig-jekyll.zip dist/SHA256SUMS --title "$TAG" --notes "$notes"
          fi
      - name: Verify the published wrapper (downloads shim.jar from this release)
        run: |
          W=$(mktemp -d); cp dist/jekyll-shim "$W/"
          FHIR_IG_JEKYLL_HOME=$(mktemp -d) scripts/e2e.sh "$W"
