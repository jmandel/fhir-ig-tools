<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">fhir-ig-tools modules and what they may depend on</title>
  <desc id="d">Three Maven modules. jekyll (Java 17) depends only on common and builds jekyll.jar. sushi (Java 17) depends on common, org.hl7.fhir.core's utilities and commons-compress, and builds sushi.jar. common (Java 17) depends on nothing. Test-only libraries: JUnit, and the ANTLR runtime for sushi's oracle parser.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .ink{fill:#1f2328}.muted{fill:#59636e}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .pub{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .tool{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .tool2{fill:#fbefff;stroke:#8250df;stroke-width:2}
    .shared{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
    .stage{fill:#ffffff;stroke:#54aeff;stroke-width:1.2}
    .stage2{fill:#ffffff;stroke:#c297ff;stroke-width:1.2}
    .stage3{fill:#ffffff;stroke:#d4a72c;stroke-width:1.2}
    .ext{fill:#ffffff;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:5 4}
    .out{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .accent{fill:#0969da}.accent2{fill:#8250df}.accent3{fill:#9a6700}.good{fill:#1a7f37}
    .wire{stroke:#59636e;stroke-width:2;fill:none}
    .wire-d{stroke:#8c959f;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .head{fill:#59636e}
    .chip-g{fill:#dafbe1;stroke:#1a7f37}.chip-a{fill:#fff8c5;stroke:#9a6700}.chip-p{fill:#fbefff;stroke:#8250df}
    .chip-r{fill:#ffebe9;stroke:#cf222e}.chip-b{fill:#ddf4ff;stroke:#0969da}
    .t-g{fill:#1a7f37}.t-a{fill:#7d4e00}.t-p{fill:#8250df}.t-r{fill:#a40e26}.t-b{fill:#0550ae}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#3d444d}
      .ink{fill:#e6edf3}.muted{fill:#9198a1}
      .card{fill:#151b23;stroke:#3d444d}
      .pub{fill:#151b23;stroke:#656c76}
      .tool{fill:#0c2d4b;stroke:#4493f8}
      .tool2{fill:#271a3c;stroke:#ab7df8}
      .shared{fill:#2e2306;stroke:#d29922}
      .stage{fill:#0d1117;stroke:#1f6feb}
      .stage2{fill:#0d1117;stroke:#8957e5}
      .stage3{fill:#0d1117;stroke:#9e6a03}
      .ext{fill:#0d1117;stroke:#656c76}
      .out{fill:#0f2e1b;stroke:#3fb950}
      .accent{fill:#4493f8}.accent2{fill:#ab7df8}.accent3{fill:#d29922}.good{fill:#3fb950}
      .wire{stroke:#9198a1}.wire-d{stroke:#656c76}.head{fill:#9198a1}
      .chip-g{fill:#0f2e1b;stroke:#3fb950}.chip-a{fill:#2e2306;stroke:#d29922}.chip-p{fill:#271a3c;stroke:#ab7df8}
      .chip-r{fill:#3c1618;stroke:#f85149}.chip-b{fill:#0c2d4b;stroke:#4493f8}
      .t-g{fill:#3fb950}.t-a{fill:#d29922}.t-p{fill:#ab7df8}.t-r{fill:#ff7b72}.t-b{fill:#79c0ff}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="343" rx="12"/>
  <text x="24" y="40" class="ink" font-size="22" font-weight="700">Modules</text>
  <text x="120" y="40" class="muted" font-size="14">and what each may depend on (enforced by the Maven enforcer on every build)</text>
  <rect class="tool" x="24" y="76" width="280" height="120" rx="10"/>
  <text x="40" y="102" class="ink mono" font-size="15" font-weight="700">jekyll/</text>
  <text x="288" y="102" class="muted" font-size="12" text-anchor="end">Java 17</text>
  <text x="40" y="126" class="muted" font-size="12">the Jekyll shim</text>
  <text x="40" y="143" class="muted" font-size="12">org.hl7.fhir.jekyll.*</text>
  <text x="40" y="182" class="ink mono" font-size="13" font-weight="600">→ jekyll.jar (self-contained)</text>
  <rect class="shared" x="340" y="236" width="280" height="92" rx="10"/>
  <text x="356" y="262" class="ink mono" font-size="15" font-weight="700">common/</text>
  <text x="604" y="262" class="muted" font-size="12" text-anchor="end">Java 17</text>
  <text x="356" y="286" class="muted" font-size="12">zero-dependency: JDK only</text>
  <text x="356" y="303" class="muted" font-size="12">org.hl7.fhir.common.{yaml,js}</text>
  <rect class="tool2" x="656" y="76" width="280" height="120" rx="10"/>
  <text x="672" y="102" class="ink mono" font-size="15" font-weight="700">sushi/</text>
  <text x="920" y="102" class="muted" font-size="12" text-anchor="end">Java 17</text>
  <text x="672" y="126" class="muted" font-size="12">the SUSHI port</text>
  <text x="672" y="143" class="muted" font-size="12">org.hl7.fhir.sushi.*</text>
  <text x="672" y="182" class="ink mono" font-size="13" font-weight="600">→ sushi.jar (self-contained)</text>
  <rect class="ext" x="656" y="236" width="280" height="92" rx="10"/>
  <text x="672" y="262" class="ink mono" font-size="13" font-weight="700">org.hl7.fhir.core</text>
  <text x="672" y="284" class="muted" font-size="12">org.hl7.fhir.utilities 7.0.6 and</text>
  <text x="672" y="301" class="muted" font-size="12">what it brings; commons-compress</text>
  <path class="wire" d="M164,196 L164,282 L336,282" marker-end="url(#arrow)"/>
  <path class="wire" d="M700,196 L700,214 L540,214 L540,232" marker-end="url(#arrow)"/>
  <path class="wire" d="M860,196 L860,232" marker-end="url(#arrow)"/>
  <text x="372" y="112" class="muted" font-size="12">test scope only: JUnit 5;</text>
  <text x="372" y="130" class="muted" font-size="12">sushi: ANTLR 4.13.2 (oracle parser)</text>
  <text x="372" y="160" class="muted" font-size="12">nothing depends on sushi</text>
</svg>
