<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 808" width="1200" height="808" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">fhir-ig-tools: Jekyll shim architecture</title>
  <desc id="d">The IG Publisher writes temp/pages; jekyll.jar reads, renders and writes it with Java ports of Liquid, kramdown, Rouge and Jekyll's YAML stack, producing output identical to Jekyll's. Three integration levels, and the oracle and golden-corpus verification.</desc>
  <style>
    .bg{fill:#ffffff}
    .ink{fill:#1f2328}.muted{fill:#59636e}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .pub{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .shim{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .stage{fill:#ffffff;stroke:#54aeff;stroke-width:1.2}
    .pkg{fill:#ffffff;stroke:#0969da;stroke-width:1.2}
    .out{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .accent{fill:#0969da}.good{fill:#1a7f37}
    .wire{stroke:#59636e;stroke-width:2;fill:none}
    .head{fill:#59636e}
    .chip-g{fill:#dafbe1;stroke:#1a7f37}.chip-a{fill:#fff8c5;stroke:#9a6700}.chip-p{fill:#fbefff;stroke:#8250df}
    .t-g{fill:#1a7f37}.t-a{fill:#7d4e00}.t-p{fill:#8250df}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .ink{fill:#e6edf3}.muted{fill:#9198a1}
      .card{fill:#151b23;stroke:#3d444d}
      .pub{fill:#151b23;stroke:#656c76}
      .shim{fill:#0c2d4b;stroke:#4493f8}
      .stage{fill:#0d1117;stroke:#1f6feb}
      .pkg{fill:#0d1117;stroke:#4493f8}
      .out{fill:#0f2e1b;stroke:#3fb950}
      .accent{fill:#4493f8}.good{fill:#3fb950}
      .wire{stroke:#9198a1}.head{fill:#9198a1}
      .chip-g{fill:#0f2e1b;stroke:#3fb950}.chip-a{fill:#2e2306;stroke:#d29922}.chip-p{fill:#271a3c;stroke:#ab7df8}
      .t-g{fill:#3fb950}.t-a{fill:#d29922}.t-p{fill:#ab7df8}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="808" rx="12"/>

  <!-- title -->
  <text x="24" y="40" class="ink" font-size="22" font-weight="700">fhir-ig-tools · jekyll</text>
  <text x="190" y="40" class="muted" font-size="14">the IG Publisher's Jekyll stage, ported to Java: no Ruby, same output</text>

  <!-- ===== row A: pipeline ===== -->
  <!-- publisher -->
  <rect class="pub" x="24" y="72" width="230" height="276" rx="10"/>
  <text x="44" y="100" class="ink" font-size="16" font-weight="700">IG Publisher</text>
  <text x="44" y="124" class="muted" font-size="13">Generates every narrative</text>
  <text x="44" y="142" class="muted" font-size="13">fragment, pre-expands layouts,</text>
  <text x="44" y="160" class="muted" font-size="13">then hands Jekyll a folder:</text>
  <g class="ink mono" font-size="12">
    <text x="44" y="194">temp/pages/</text>
    <text x="58" y="214">*.html *.md</text><text x="160" y="214" class="muted">pages</text>
    <text x="58" y="234">_includes/</text><text x="160" y="234" class="muted">fragments</text>
    <text x="58" y="254">_data/</text><text x="160" y="254" class="muted">JSON, YAML</text>
    <text x="58" y="274">_config.yml</text>
  </g>
  <text x="44" y="306" class="muted" font-size="12">12k–260k input files per IG,</text>
  <text x="44" y="324" class="muted" font-size="12">mostly {% raw %} includes</text>

  <line class="wire" x1="256" y1="210" x2="296" y2="210" marker-end="url(#arrow)"/>

  <!-- shim -->
  <rect class="shim" x="300" y="72" width="600" height="276" rx="10"/>
  <text x="320" y="100" class="ink" font-size="16" font-weight="700">jekyll.jar</text>
  <text x="880" y="100" class="muted" font-size="12" text-anchor="end">Java 17+ · JDK only · ~650 KB · jekyll build --destination</text>

  <rect class="stage" x="320" y="114" width="176" height="84" rx="8"/>
  <text x="334" y="136" class="accent" font-size="14" font-weight="700">1 · Read</text>
  <text x="334" y="156" class="ink" font-size="12">parallel walk + classify</text>
  <text x="334" y="173" class="ink" font-size="12">YAML front matter, _data</text>
  <text x="334" y="190" class="ink" font-size="12">lazy, thread-safe site</text>

  <line class="wire" x1="497" y1="156" x2="510" y2="156" marker-end="url(#arrow)"/>

  <rect class="stage" x="512" y="114" width="176" height="84" rx="8"/>
  <text x="526" y="136" class="accent" font-size="14" font-weight="700">2 · Render</text>
  <text x="526" y="156" class="ink" font-size="12">all pages in parallel</text>
  <text x="526" y="173" class="ink" font-size="12">Liquid → markdownify</text>
  <text x="526" y="190" class="ink" font-size="12">per-thread include cache</text>

  <line class="wire" x1="689" y1="156" x2="702" y2="156" marker-end="url(#arrow)"/>

  <rect class="stage" x="704" y="114" width="176" height="84" rx="8"/>
  <text x="718" y="136" class="accent" font-size="14" font-weight="700">3 · Write</text>
  <text x="718" y="156" class="ink" font-size="12">streamed as rendered</text>
  <text x="718" y="173" class="ink" font-size="12">statics copied alongside</text>
  <text x="718" y="190" class="ink" font-size="12">Jekyll's path rules</text>

  <text x="320" y="222" class="muted" font-size="12">file-by-file ports of the exact Ruby gems the autobuilder runs</text>

  <g font-size="12">
    <rect class="pkg" x="320" y="232" width="128" height="100" rx="8"/>
    <text x="334" y="254" class="ink mono" font-size="13" font-weight="700">liquid</text>
    <text x="334" y="274" class="ink">Liquid 4.0.4</text>
    <text x="334" y="292" class="muted">warn-mode parsing</text>
    <text x="334" y="310" class="muted">Ruby value rules</text>

    <rect class="pkg" x="464" y="232" width="128" height="100" rx="8"/>
    <text x="478" y="254" class="ink mono" font-size="13" font-weight="700">kramdown</text>
    <text x="478" y="274" class="ink">kramdown 2.5.2</text>
    <text x="478" y="292" class="muted">+ GFM parser 1.1.0</text>
    <text x="478" y="310" class="muted">linear emphasis</text>

    <rect class="pkg" x="608" y="232" width="128" height="100" rx="8"/>
    <text x="622" y="254" class="ink mono" font-size="13" font-weight="700">rouge</text>
    <text x="622" y="274" class="ink">Rouge 4.7.0</text>
    <text x="622" y="292" class="muted">IG fence lexers</text>
    <text x="622" y="310" class="muted">identical spans</text>

    <rect class="pkg" x="752" y="232" width="128" height="100" rx="8"/>
    <text x="766" y="254" class="ink mono" font-size="13" font-weight="700">yaml</text>
    <text x="766" y="274" class="ink">SafeYAML · Psych</text>
    <text x="766" y="292" class="muted">libyaml 0.2.5</text>
    <text x="766" y="310" class="muted">Ruby Date &amp; Float</text>
  </g>

  <line class="wire" x1="902" y1="210" x2="942" y2="210" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect class="out" x="946" y="72" width="230" height="276" rx="10"/>
  <text x="966" y="100" class="ink" font-size="16" font-weight="700">output/</text>
  <text x="966" y="124" class="muted" font-size="13">The same HTML Jekyll writes</text>
  <text x="966" y="142" class="muted" font-size="13">(normalized DOM, exact,</text>
  <text x="966" y="160" class="muted" font-size="13">highlight spans included)</text>
  <text x="966" y="200" class="good" font-size="26" font-weight="700">99 / 99</text>
  <text x="966" y="220" class="ink" font-size="13">golden IGs identical</text>
  <text x="966" y="254" class="good" font-size="26" font-weight="700">3–5×</text>
  <text x="966" y="274" class="ink" font-size="13">faster than Jekyll</text>
  <text x="966" y="308" class="good" font-size="26" font-weight="700">½</text>
  <text x="992" y="308" class="ink" font-size="13">the peak memory (UTG)</text>

  <!-- ===== row B: integration ===== -->
  <text x="24" y="390" class="ink" font-size="16" font-weight="700">How the publisher calls it</text>

  <rect class="card" x="24" y="404" width="372" height="104" rx="10"/>
  <text x="42" y="430" class="ink" font-size="14" font-weight="700">1 · CLI drop-in</text>
  <rect class="chip-g" x="282" y="415" width="98" height="22" rx="11"/>
  <text x="331" y="430" class="t-g" font-size="12" font-weight="600" text-anchor="middle">works today</text>
  <text x="42" y="456" class="ink mono" font-size="12">-jekyll /path/to/jekyll-shim</text>
  <text x="42" y="478" class="muted" font-size="12">Jekyll's command line and console output;</text>
  <text x="42" y="495" class="muted" font-size="12">no publisher change needed</text>

  <rect class="card" x="414" y="404" width="372" height="104" rx="10"/>
  <text x="432" y="430" class="ink" font-size="14" font-weight="700">2 · In-process library</text>
  <rect class="chip-a" x="694" y="415" width="76" height="22" rx="11"/>
  <text x="732" y="430" class="t-a" font-size="12" font-weight="600" text-anchor="middle">prototype</text>
  <text x="432" y="456" class="ink mono" font-size="12">Shim.build(temp, out, log)</text>
  <text x="432" y="478" class="muted" font-size="12">no subprocess, no second JVM;</text>
  <text x="432" y="495" class="muted" font-size="12">render errors flow straight into QA</text>

  <rect class="card" x="804" y="404" width="372" height="104" rx="10"/>
  <text x="822" y="430" class="ink" font-size="14" font-weight="700">3 · In-memory, lazy fragments</text>
  <rect class="chip-p" x="1074" y="415" width="88" height="22" rx="11"/>
  <text x="1118" y="430" class="t-p" font-size="12" font-weight="600" text-anchor="middle">not pursued</text>
  <text x="822" y="456" class="ink mono" font-size="12">include → provider.fragment(name)</text>
  <text x="822" y="478" class="muted" font-size="12">publisher generates a fragment only when</text>
  <text x="822" y="495" class="muted" font-size="12">an include first needs it; no temp/pages</text>

  <!-- ===== row C: verification ===== -->
  <text x="24" y="548" class="ink" font-size="16" font-weight="700">How we know it matches</text>

  <rect class="card" x="24" y="562" width="566" height="222" rx="10"/>
  <text x="42" y="588" class="ink" font-size="14" font-weight="700">Differential oracle</text>
  <text x="42" y="610" class="muted" font-size="12">Every case runs through the real Ruby gem (in the pinned autobuilder</text>
  <text x="42" y="627" class="muted" font-size="12">image) and through the Java port; the outputs must be identical.</text>
  <g class="mono" font-size="12">
    <text x="42" y="660" class="accent" font-weight="700">Liquid</text><text x="132" y="660" class="ink">4,167 cases (+150 CRLF)</text>
    <text x="42" y="682" class="accent" font-weight="700">kramdown</text><text x="132" y="682" class="ink">2,207 real fragments · 1,043 suite · 4,000 adversarial</text>
    <text x="42" y="704" class="accent" font-weight="700">YAML</text><text x="132" y="704" class="ink">687 real files · 804 yaml-test-suite · 343k fuzz</text>
    <text x="42" y="726" class="accent" font-weight="700">Rouge</text><text x="132" y="726" class="ink">2,467 fragments mined from real IGs</text>
    <text x="42" y="748" class="accent" font-weight="700">Jekyll</text><text x="132" y="748" class="ink">73 site-behavior cases</text>
  </g>

  <rect class="card" x="610" y="562" width="566" height="222" rx="10"/>
  <text x="628" y="588" class="ink" font-size="14" font-weight="700">Golden corpus</text>
  <g font-size="12">
    <rect class="stage" x="628" y="604" width="160" height="50" rx="8"/>
    <text x="708" y="625" class="ink" text-anchor="middle">real IG repos</text>
    <text x="708" y="642" class="muted" text-anchor="middle">built on build.fhir.org</text>
    <line class="wire" x1="789" y1="629" x2="808" y2="629" marker-end="url(#arrow)"/>
    <rect class="stage" x="810" y="604" width="168" height="50" rx="8"/>
    <text x="894" y="625" class="ink" text-anchor="middle">publisher + Jekyll 4.4.1</text>
    <text x="894" y="642" class="muted" text-anchor="middle">capture input + output</text>
    <line class="wire" x1="979" y1="629" x2="998" y2="629" marker-end="url(#arrow)"/>
    <rect class="stage" x="1000" y="604" width="158" height="50" rx="8"/>
    <text x="1079" y="625" class="ink" text-anchor="middle">shim on same input</text>
    <text x="1079" y="642" class="muted" text-anchor="middle">domdiff, exact</text>
  </g>
  <text x="628" y="702" class="good" font-size="24" font-weight="700">493,294 files · 0 differences</text>
  <text x="628" y="726" class="ink" font-size="13">across 99 IGs, including UTG (89,572 output files)</text>
  <text x="628" y="748" class="muted" font-size="12">Per-run data aside (timestamps, GUIDs), a full publisher run with the</text>
  <text x="628" y="765" class="muted" font-size="12">shim produces the same output/ folder as one with Jekyll.</text>
</svg>
